<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARC-OSC Client</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            overflow: hidden;
            background: linear-gradient(135deg, #1a0a2e 0%, #2d1b4e 50%, #4a2c6d 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #ffffff;
        }

        .splash-container {
            text-align: center;
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-container {
            margin-bottom: 30px;
            position: relative;
        }

        .logo {
            width: 120px;
            height: 120px;
            object-fit: contain;
            filter: drop-shadow(0 4px 20px rgba(138, 43, 226, 0.5));
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                filter: drop-shadow(0 4px 20px rgba(138, 43, 226, 0.5));
            }
            50% {
                transform: scale(1.05);
                filter: drop-shadow(0 4px 30px rgba(138, 43, 226, 0.8));
            }
        }

        .glow-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 140px;
            height: 140px;
            border: 2px solid rgba(138, 43, 226, 0.3);
            border-radius: 50%;
            animation: ringPulse 2s ease-in-out infinite;
        }

        @keyframes ringPulse {
            0%, 100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.3;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.2);
                opacity: 0;
            }
        }

        h1 {
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #a855f7 0%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 1px;
        }

        .subtitle {
            font-size: 14px;
            color: #c4b5fd;
            margin-bottom: 40px;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        .progress-container {
            width: 300px;
            margin: 0 auto 15px;
        }

        .progress-bar-bg {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #7c3aed 0%, #a855f7 50%, #c084fc 100%);
            border-radius: 2px;
            transition: width 0.3s ease;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.5);
            position: relative;
        }

        .progress-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% {
                transform: translateX(-100%);
            }
            100% {
                transform: translateX(100%);
            }
        }

        .loading-text {
            font-size: 13px;
            color: #c4b5fd;
            font-weight: 400;
            min-height: 20px;
            transition: opacity 0.3s ease;
        }

        .loading-dots::after {
            content: '';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% {
                content: '';
            }
            40% {
                content: '.';
            }
            60% {
                content: '..';
            }
            80%, 100% {
                content: '...';
            }
        }

        .version {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            color: rgba(196, 181, 253, 0.5);
            font-weight: 300;
        }
    </style>
</head>
<body>
    <div class="splash-container">
        <div class="logo-container">
            <div class="glow-ring"></div>
            <img src="./ARC.ico" alt="ARC Logo" class="logo">
        </div>
        <h1>ARC-OSC Client</h1>
        <p class="subtitle">Avatar Remote Control</p>
        <div class="progress-container">
            <div class="progress-bar-bg">
                <div class="progress-bar" id="progressBar"></div>
            </div>
        </div>
        <p class="loading-text" id="loadingText">
            <span class="loading-dots">Initializing</span>
        </p>
    </div>
    <div class="version" id="version">v0.0.0</div>

    <script>
        const { ipcRenderer } = require('electron');
        // Listen for progress updates from main process
        ipcRenderer.on('splash-progress', (event, data) => {
            const { progress, message } = data;
            const progressBar = document.getElementById('progressBar');
            const loadingText = document.getElementById('loadingText');
            console.log(`Splash progress: ${progress}% - ${message}`);
            if (progressBar && progress !== undefined) {
                progressBar.style.width = `${progress}%`;
            }
            if (loadingText && message) {
                loadingText.innerHTML = `<span class="loading-dots">${message}</span>`;
            }
        });
        // Listen for version updates
        ipcRenderer.on('splash-version', (event, version) => {
            const versionElement = document.getElementById('version');
            if (versionElement) {
                versionElement.textContent = `v${version}`;
            }
        });
        // Request version on load
        ipcRenderer.invoke('get-client-version').then(version => {
            const versionElement = document.getElementById('version');
            if (versionElement) {
                versionElement.textContent = `v${version}`;
            }
        });
    </script>
</body>
</html>
